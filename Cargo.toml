[workspace]
resolver = "2"
members = [
    "crates/cad-app",
    "crates/cad-ir",
    "crates/cad-kernel",
    "crates/cad-kernel-occ",
    "crates/cad-kernel-truck",
    "crates/cad-script",
    "crates/cad-view",
    "crates/cad-view-threed",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
cad-ir = { path = "crates/cad-ir" }
cad-kernel = { path = "crates/cad-kernel" }
cad-kernel-occ = { path = "crates/cad-kernel-occ" }
cad-kernel-truck = { path = "crates/cad-kernel-truck" }
cad-script = { path = "crates/cad-script" }
cad-view = { path = "crates/cad-view" }
cad-view-threed = { path = "crates/cad-view-threed" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "2"
