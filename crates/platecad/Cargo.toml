[package]
name = "platecad"
version.workspace = true
edition.workspace = true
license.workspace = true

# The command is `plate`; the package and repo are `platecad`.
[[bin]]
name = "plate"
path = "src/main.rs"

[dependencies]
cad-export.workspace = true
cad-ir.workspace = true
cad-kernel.workspace = true
cad-kernel-occ.workspace = true
cad-kernel-truck.workspace = true
cad-script.workspace = true
cad-view.workspace = true
cad-view-threed.workspace = true
clap = { version = "4", features = ["derive", "env"] }
notify = "8"
serde = { workspace = true }
toml = "0.8"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
